name: Bug report
description: Report a problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a bug or problem with one of the Paddle agent skills.

        Remember to remove sensitive information from screenshots, videos, or code samples before submitting.

        **Do not create issues for potential security vulnerabilities.** Please see the [Paddle Vulnerability Disclosure Policy](https://www.paddle.com/vulnerability-disclosure-policy) and report any vulnerabilities [using our form](https://vdp.paddle.com/p/Report-a-Vulnerability).

        Thanks for helping to make the Paddle platform better for everyone!
  - type: input
    id: skill
    attributes:
      label: Which skill?
      description: Name of the skill the bug relates to (the `name` from its `SKILL.md` frontmatter).
      placeholder: e.g. paddle-checkout-web
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent / tool
      description: Which agentic tool were you using when you hit the issue?
      placeholder: e.g. Claude Code 2.x, Claude Desktop, Cursor
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug in a sentence or two. Feel free to add screenshots or a video to better explain!
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce this issue. We prefer a step-by-step walkthrough, where possible.
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: Tell us what should happen when you encounter this bug.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Copy and paste any relevant logs or agent transcripts. This is automatically formatted into code, so no need for backticks.
      render: shell
